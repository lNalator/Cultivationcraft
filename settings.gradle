pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }        
        mavenCentral()
    }
}

rootProject.name = 'cultivationcraft'

// Keep MLM Animator's own packages and ownership. Maven coordinates are
// case-sensitive: this must match the lowercase group in MLM's build.gradle and
// the dependency in this project's build.gradle, or the substitution is skipped.
def mlmSourceDir = file(providers.gradleProperty('mlmSourceDir').getOrElse('../MultilLimbedModel'))
if (!new File(mlmSourceDir, 'build.gradle').isFile()) {
    throw new GradleException('MLM Animator sources are required. Check out lNalator/MultilLimbedModel '
            + 'beside this project, or pass -PmlmSourceDir=/path/to/MultilLimbedModel. '
            + 'The release workflow checks out the supported revision automatically.')
}
includeBuild(mlmSourceDir) {
    dependencySubstitution {
        substitute module('lnalator.mlmanimator:mlmanimator') using project(':')
    }
}
